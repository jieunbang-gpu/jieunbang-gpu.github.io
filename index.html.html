<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인생은글로발 · 쮜은class</title>
<style>
:root{color-scheme:light;--ink:#4b2639;--muted:#734659;--line:#efbacc;--pink:#fbdce3;--accent:#ffa9ca}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(#edb6cc 1px,transparent 1px) 0 0/18px 18px,#ffe4f0;color:var(--ink);font:1rem/1.5 system-ui,sans-serif}
main{width:min(100% - 1.5rem,45rem);margin:auto;padding:1.5rem 0 3rem}
header,section{border:1px solid var(--line);border-radius:1.65rem;padding:clamp(1rem,4vw,2rem);box-shadow:0 5px 0 #efb5cf}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:#ffc1dc;overflow:hidden}
h1,h2,p{margin:0}
h1{font-size:clamp(1.75rem,7vw,4.1rem);line-height:1.05;letter-spacing:-.075em;margin:.25rem 0 .5rem}
h2{font-size:clamp(1.4rem,5vw,1.8rem);letter-spacing:-.045em}
.brand{font:bold italic 1.15rem Georgia,serif;color:#852650}
.date,.stats{display:inline-block;border-radius:2rem;background:#fff0f7;padding:.3rem .7rem;font-size:.82rem;font-weight:750;margin-top:.75rem}
section{margin-top:1.45rem;background:#fff9fd}
.sub,.status,.ko{color:var(--muted);font-size:.94rem}
.sub{margin-top:.35rem}
.status{margin-top:.5rem;min-height:1.4em}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
button,select,input{font:inherit;color:inherit;min-height:44px}
button,select{border:1px solid #d990ad;border-radius:.85rem;background:#ffe9f3;padding:.45rem .65rem;font-weight:750}
button{cursor:pointer}
button:hover:not(:disabled){background:#ffcee3}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--accent)}
:focus-visible{outline:3px solid #923363;outline-offset:3px}
ol{list-style:none;padding:0;margin:.65rem 0 0;display:grid;gap:.55rem}
li{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:.5rem;align-items:center;padding:.8rem;border:1px solid #f0cfdf;border-radius:1rem;background:#fff0f8}
li:nth-child(even){background:#fff2f3;border-color:#f0d8df}
li[aria-current=true]{background:#ffd4ea;outline:2px solid #9c3265}
.en{font-size:clamp(1.12rem,4.65vw,1.5rem);font-weight:800;overflow-wrap:anywhere}
.listen{border-radius:50%;width:44px;padding:0}
.stats,.prompt{background:var(--pink)}
.prompt{border-radius:.8rem;padding:.7rem .8rem;margin:.9rem 0 .65rem;font-size:1.15rem;font-weight:760}
label{font-weight:750}
input{display:block;width:100%;border:1px solid #c480a0;border-radius:.85rem;padding:.6rem .75rem;margin-top:.3rem}
.good{color:#27613c}.bad,#saveWarning{color:#893c33}

main { position:relative; z-index:1; }
header { column-gap:clamp(.65rem,3vw,1.4rem); }
header h1 { font-size:clamp(1.7rem,6.2vw,3.65rem); overflow-wrap:anywhere; }
.character {
  display:block;
  width:clamp(5rem,24vw,11rem);
  height:auto;
  border:3px solid #fff7fc;
  border-radius:26%;
  box-shadow:0 .4rem 0 #e880ac;
  transform:rotate(5deg);
}
.floating-hearts { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
.floating-hearts span {
  position:absolute;
  left:var(--x);
  bottom:-3rem;
  font-size:var(--size);
  color:#c92f74;
  animation:float-heart var(--time) linear var(--delay) infinite,
            twinkle 3s ease-in-out var(--delay) infinite;
}
@keyframes float-heart {
  from { transform:translate3d(-.4rem,0,0) rotate(-13deg); }
  to { transform:translate3d(.65rem,calc(-100vh - 6rem),0) rotate(15deg); }
}
@keyframes twinkle {
  0%, 100% { opacity:.26; text-shadow:0 0 3px white; }
  50% { opacity:.79; text-shadow:0 0 8px white, 0 0 14px #f665aa; }
}
@media (max-width:480px) {
  main { width:calc(100% - 1.25rem); padding-top:1rem; }
  header, section { padding:.85rem; }
  header h1 { font-size:clamp(1.45rem,6.4vw,2.2rem); }
  .character { width:clamp(4.5rem,24vw,7rem); }
  .row { gap:.4rem; }
  button, select { font-size:.94rem; padding-inline:.55rem; }
  input { font-size:1rem; }
  .listen { padding:0; }
  li { padding:.6rem; }
}
@media (prefers-reduced-motion:reduce) {
  .floating-hearts span {
    animation:none;
    bottom:calc(15% + var(--x) / 2);
    opacity:.35;
  }
}
</style>

<script>

// 기존 학습 기록은 문장 순서를 기준으로 저장됩니다.

  ["Could you save me a seat?", "제 자리 좀 맡아 줄 수 있어요?"],
  ["When is the assignment due?", "과제 마감이 언제예요?"],
  ["I need to catch up on my reading.", "밀린 읽기 과제를 해야 해요."],
  ["Are you free after class?", "수업 끝나고 시간 돼요?"],
  ["Let's grab lunch after class.", "수업 끝나고 점심 먹어요."],
  ["Can I borrow your charger?", "충전기 좀 빌려도 될까요?"],
  ["I left my umbrella in the classroom.", "강의실에 우산을 두고 왔어요."],

  ["I haven't decided what to order yet.", "아직 뭘 주문할지 못 정했어요."],
  ["Can I get this to go?", "이거 포장해 주실 수 있나요?"],
  ["Could we split the bill?", "계산 나눠서 할 수 있을까요?"],
  ["I'm heading to the library.", "저 지금 도서관에 가는 중이에요."],
  ["I have a lot on my plate this week.", "이번 주에는 할 일이 너무 많아요."],
  ["Let me check my schedule first.", "일정부터 확인해 볼게요."],
  ["Does tomorrow afternoon work for you?", "내일 오후 괜찮아요?"],

  ["Can you show me how this works?", "이거 어떻게 쓰는지 보여 줄 수 있어요?"],
  ["I couldn't hear the last part.", "마지막 부분을 못 들었어요."],

const $ = id => document.getElementById(id);
const key = "daily-five-english-v1";
const state = { days: {}, correct: 0, attempts: 0, rate: 1, autoplay: false };
try {
  Object.assign(state, JSON.parse(localStorage.getItem(key)));
} catch {
  $("saveWarning").hidden = false;
}

function save() {
  try {
    localStorage.setItem(key, JSON.stringify(state));
  } catch {
    $("saveWarning").hidden = false;
  }
}

function shuffled(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function dateKey(date) {
  return [date.getFullYear(), date.getMonth() + 1, date.getDate()]
    .map(value => String(value).padStart(2, "0")).join("-");
}

let day, question;
let today = [], queue = [];
let answered = false;

function learned() {
  return [...new Set(Object.values(state.days).flat())];
}

function stats() {
  $("stats").textContent = "모은 문장 " + learned().length + "개 · 정답 " + state.correct + "/" + state.attempts;
}

function card(id, index) {
  const item = document.createElement("li");
  const copy = document.createElement("div");
  const english = document.createElement("p");
  const korean = document.createElement("p");
  const button = document.createElement("button");

  english.lang = "en";
  english.className = "en";
  english.textContent = bank[id][0];
  korean.className = "ko";
  korean.textContent = bank[id][1];
  button.type = "button";
  button.className = "listen";
  button.textContent = "▶";
  button.setAttribute("aria-label", (index + 1) + "번 문장 듣기");
  button.addEventListener("click", () => play([id]));
  copy.append(english, korean);
  item.append(copy, button);
  return item;
}

function refreshDay() {
  const now = new Date();
  const nextDay = dateKey(now);
  if (day === nextDay) return;

  stopAudio();
  if (!state.days[nextDay]) {
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    const previous = state.days[dateKey(yesterday)] || [];
    state.days[nextDay] = shuffled(bank.map((_, id) => id).filter(id => !previous.includes(id))).slice(0, 5);
    save();
  }

  day = nextDay;
  today = state.days[day];
  $("date").textContent = new Intl.DateTimeFormat("ko-KR", {
    month: "long", day: "numeric", weekday: "long"
  }).format(now);
  $("sentences").replaceChildren(...today.map(card));
  queue = [];
  if (question === undefined) nextQuestion();
  stats();
  if (state.autoplay && !document.hidden) play(today);
}

const synth = window.speechSynthesis;
let generation = 0, timer, active;
let playlist = [], position = 0;

function highlight(id) {
  [...$("sentences").children].forEach((item, index) => {
    if (today[index] === id) item.setAttribute("aria-current", "true");
    else item.removeAttribute("aria-current");
  });
}

function stopAudio(message = "") {
  generation++;
  clearTimeout(timer);
  if (active) {
    active.onstart = active.onend = active.onerror = null;
    synth.cancel();
  }
  active = null;
  highlight();
  $("stop").disabled = true;
  $("audioStatus").textContent = message;
}

function speak(current) {
  const id = playlist[position];
  const utterance = new SpeechSynthesisUtterance(bank[id][0]);
  const voices = synth.getVoices().filter(voice => voice.localService);
  const english = voices.find(voice => voice.lang.toLowerCase() === "en-us")
    || voices.find(voice => /^en([-_]|$)/i.test(voice.lang));
  if (english) utterance.voice = english;
  utterance.lang = english ? english.lang : "en-US";
  utterance.rate = state.rate;
  active = utterance;
  highlight(id);
  let started = performance.now();

  utterance.onstart = () => {
    if (current !== generation) return;
    clearTimeout(timer);
    started = performance.now();
    $("audioStatus").textContent = (today.indexOf(id) + 1) + "번 문장 듣는 중";
  };

  utterance.onend = () => {
    if (current !== generation) return;
    clearTimeout(timer);
    active = null;
    $("audioStatus").textContent = "지금 따라 읽어 보세요!";
    timer = setTimeout(() => {
      if (current !== generation) return;
      position++;
      if (position < playlist.length) speak(current);
      else stopAudio("따라 읽기 완료! ✦");
    }, Math.max(2300, performance.now() - started + 600));
  };

  utterance.onerror = event => {
    if (current !== generation) return;
    stopAudio(event.error === "not-allowed"
      ? "듣기 버튼을 눌러 재생해 주세요."
      : "음성 재생이 어려워요. 기기에 영어 음성이 설치되어 있는지 확인해 주세요.");
  };

  timer = setTimeout(() => {
    if (current === generation) stopAudio("재생이 시작되지 않았어요. 듣기 버튼을 눌러 주세요.");
  }, 5000);
  synth.speak(utterance);
}

function play(ids) {
  stopAudio();
  if (!synth || !("SpeechSynthesisUtterance" in window)) {
    stopAudio("이 브라우저에서는 음성 읽기를 지원하지 않아요.");
    return;
  }
  playlist = [...ids];
  position = 0;
  $("stop").disabled = false;
  $("audioStatus").textContent = "영어 음성을 준비하고 있어요.";
  speak(generation);
}

$("speed").value = String(state.rate);
$("speed").addEventListener("change", () => {
  state.rate = Number($("speed").value);
  save();
  if (active) {
    stopAudio();
    $("stop").disabled = false;
    speak(generation);
  }
});
$("play").addEventListener("click", () => {
  state.autoplay = true;
  save();
  play(today);
});
$("stop").addEventListener("click", () => {
  state.autoplay = false;
  save();
  stopAudio("재생을 멈췄어요.");
});

const contractions = {
  "i'm": "i am", "i'll": "i will", "we're": "we are", "let's": "let us",
  "haven't": "have not", "couldn't": "could not", "didn't": "did not"
};

function normalize(text) {
  return text.toLowerCase().replace(/[’‘]/g, "'")
    .replace(/[.,!?;:"“”]/g, "")
    .replace(/\b(?:i'm|i'll|we're|let's|haven't|couldn't|didn't)\b/g, match => contractions[match])
    .replace(/\s+/g, " ").trim();
}

function nextQuestion() {
  if (!queue.length) {
    queue = shuffled(learned());
    if (queue.length > 1 && queue[0] === question) queue.push(queue.shift());
  }
  question = queue.shift();
  answered = false;
  $("prompt").textContent = bank[question][1];
  $("answer").value = "";
  $("answer").readOnly = false;
  $("check").disabled = $("reveal").disabled = false;
  $("feedback").className = "status";
  $("feedback").textContent = "";
}

function finish(message, tone, showAnswer) {
  answered = true;
  $("answer").readOnly = true;
  $("check").disabled = $("reveal").disabled = true;
  const feedback = $("feedback");
  feedback.className = "status " + tone;
  feedback.textContent = message;
  if (showAnswer) {
    const solution = document.createElement("span");
    solution.lang = "en";
    solution.textContent = " " + bank[question][0];
    feedback.append(solution);
  }
}

$("quiz").addEventListener("submit", event => {
  event.preventDefault();
  if (answered) return;
  const answer = normalize($("answer").value);
  if (!answer) {
    $("feedback").textContent = "영어 문장을 입력해 주세요.";
    return;
  }
  const correct = answer === normalize(bank[question][0]);
  state.attempts++;
  if (correct) state.correct++;
  save();
  stats();
  if (correct) finish("정답이에요! ✦", "good", false);
  else finish("학습했던 문장", "bad", true);
});

$("reveal").addEventListener("click", () => finish("정답", "", true));
$("next").addEventListener("click", () => {
  nextQuestion();
  $("answer").focus();
});

refreshDay();
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refreshDay();
});
window.addEventListener("focus", refreshDay);
setInterval(() => {
  if (!document.hidden) refreshDay();
}, 15000);
</script>
</body>
